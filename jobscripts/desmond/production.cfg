# PaCS-MD Desmond production cfg example
# This is a reference template for users to copy and adjust
# Not used directly by the code - modify according to your system
# NOTE: temperature (300K) and other physics parameters came from one specific real
# job and should be reviewed/adjusted for your own system before use.

annealing = false
backend = {
}
checkpt = {
   first = 0.0
   interval = 240.0
   name = "$JOBNAME.cpt"
   write_last_step = true
}
cutoff_radius = 9.0
elapsed_time = 0.0
eneseq = {
   first = 0.0
   interval = 1.2
   name = "$JOBNAME$[_replica$REPLICA$].ene"
}
ensemble = {
   barostat = {
      tau = 2.0
   }
   class = NPT
   method = MTK
   thermostat = {
      tau = 1.0
   }
}
glue = solute
maeff_output = {
   center_atoms = solute
   first = 0.0
   interval = 120.0
   name = "$JOBNAME$[_replica$REPLICA$]-out.cms"
   periodicfix = true
   trjdir = "$JOBNAME$[_replica$REPLICA$]_trj"
}
polarization_restraints = none
pressure = [1.01325 isotropic]
randomize_velocity = {
   first = 0.0
   interval = inf
   seed = 2007
   temperature = "@*.temperature"
}
restrain = none
restraints = {
   existing = ignore
   new = []
}
temperature = [
   [300.0 0]
]
# time is a short PaCS-MD cycle length placeholder - the source job this was based on
# used 500000.0 (500ns) for its own long single production run. Tune this to match
# your own cycle length.
time = 20.0
timestep = [0.004 0.004 0.008]
trajectory = {
   center = []
   first = 0.0
   format = dtr
   frames_per_file = 250
   # interval must stay well below `time` above, or PaCS-MD's exporter
   # will have too few frames to rank and pick n_replica distinct
   # candidates from (confirmed by a real run: time=20.0 with the
   # original interval=500.0 produced only 2 frames - frame 0 plus the
   # forced last-step write - and crashed export with "total number of
   # frames ... is less than the number of replicas"). This value gives
   # ~50 frames across a 20.0 ps cycle; rescale together with `time`.
   interval = 0.4
   name = "$JOBNAME$[_replica$REPLICA$]_trj"
   periodicfix = true
   write_last_step = true
   write_last_vel = false
   write_velocity = false
}
